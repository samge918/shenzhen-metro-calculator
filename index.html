.container{display:flex;min-height:100vh}
.left-panel{width:420px;background:#fff;border-right:1px solid #ddd;overflow-y:auto;display:flex;flex-direction:column}

.search-suggest.show{display:block}
.suggest-item{padding:12px 14px;cursor:pointer;font-size:15px;border-bottom:1px solid #f0f0f0}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active{background:#f0f0f0}
.suggest-item .line-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;margin-left:8px;color:#fff}
.lines-list{flex:1;overflow-y:auto;padding:10px}
.line-section{margin-bottom:10px;border:1px solid #e0e0e0;border-radius:8px;overflow:hidden}
.line-header{padding:12px 14px;font-weight:bold;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px;user-select:none;background:#fafafa}
.line-header:active{background:#f0f0f0}
.line-header .line-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
.line-header .expand-icon{margin-left:auto;font-size:12px;color:#888;transition:transform 0.2s}
.line-header.collapsed .expand-icon{transform:rotate(-90deg)}
.line-stations{padding:10px;background:#fff;display:flex;flex-wrap:wrap;gap:8px}
.line-stations.hidden{display:none}
.station-btn{padding:8px 14px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;cursor:pointer;font-size:14px;transition:all 0.2s;touch-action:manipulation}
.station-btn:active{background:#e0e0e0;transform:scale(0.98)}
.station-btn.transfer{border-color:#e67e22;border-width:2px;font-weight:bold}
.station-btn.selected-from{background:#2b5797;color:#fff;border-color:#2b5797}
.station-btn.selected-to{background:#e67e22;color:#fff;border-color:#e67e22}

.station-input-group{position:relative}

.station-input-group .station-suggest.show{display:block}
.btn-row{display:flex;gap:10px;margin-top:12px}

.btn-row .calc-btn{background:#2b5797;color:#fff;border:none}
.btn-row .calc-btn:active{background:#1a3d6e}
.btn-row .swap-btn{background:#fff}

.result-card{flex:1;overflow-y:auto;padding:16px}

.footer{padding:12px;text-align:center;font-size:11px;color:#aaa;border-top:1px solid #eee;background:#fafafa}

var STATION_POS = {};
var GRAPH = {};

function buildGraph() {
    var lineIds = Object.keys(LINES);
    for (var i = 0; i < lineIds.length; i++) {
        var lineId = lineIds[i];
        var stations = LINES[lineId];
        for (var j = 0; j < stations.length; j++) {
            var s = stations[j];
            var name = s[0];
            if (!STATION_POS[name]) {
                STATION_POS[name] = {lines: [lineId]};
            } else {
                var found = false;
                for (var k = 0; k < STATION_POS[name].lines.length; k++) {
                    if (STATION_POS[name].lines[k] === lineId) { found = true; break; }
                }
                if (!found) STATION_POS[name].lines.push(lineId);
            }
        }
        for (var m = 0; m < stations.length - 1; m++) {
            var n1 = stations[m][0], n2 = stations[m + 1][0];
            if (!GRAPH[n1]) GRAPH[n1] = {};
            if (!GRAPH[n2]) GRAPH[n2] = {};
            if (!GRAPH[n1][n2]) GRAPH[n1][n2] = [];
            if (!GRAPH[n2][n1]) GRAPH[n2][n1] = [];
            GRAPH[n1][n2].push(lineId);
            GRAPH[n2][n1].push(lineId);
        }
    }
}

function renderLinesList() {
    var container = document.getElementById("lines-list");
    var html = "";
    var lineIds = Object.keys(LINES);

    for (var i = 0; i < lineIds.length; i++) {
        var lineId = lineIds[i];
        var color = LINE_COLORS[lineId] || "#999";
        var stations = LINES[lineId];
        
        html += '<div class="line-section">';
        html += '<div class="line-header" data-line="' + lineId + '">';
        html += '<span class="line-dot" style="background:' + color + '"></span>';
        html += '<span>' + LINE_NAMES[lineId] + '</span>';
        html += '<span class="expand-icon">鈻?/span>';
        html += '</div>';
        html += '<div class="line-stations" data-line="' + lineId + '">';
        
        for (var j = 0; j < stations.length; j++) {
            var sName = stations[j][0];
            var isTransfer = TRANSFER_STATIONS[sName] && TRANSFER_STATIONS[sName].length > 1;
            html += '<button class="station-btn' + (isTransfer ? ' transfer' : '') + '" data-name="' + sName + '">';
            html += sName;
            if (isTransfer) html += '<span class="transfer-icon">鉄?/span>';

        html += '</div></div>';

    container.innerHTML = html;

    var btns = document.querySelectorAll(".station-btn");
    for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener("click", function() {
            var name = this.getAttribute("data-name");
            handleStationClick(name);
        });
    }
}

function handleStationClick(stationName) {
    var fromInput = document.getElementById("from-station");
    var toInput = document.getElementById("to-station");
    var fromValue = fromInput.value;
    var toValue = toInput.value;
    
    if (stationName === fromValue) {
        fromInput.value = "";
        if (!toValue) {
            document.getElementById("result-card").className = "result-card empty";
            document.getElementById("result-card").innerHTML = "璇烽€夋嫨璧风偣鍜岀粓鐐圭珯";
        }
    } else if (stationName === toValue) {
        toInput.value = "";
        document.getElementById("result-card").className = "result-card empty";
        document.getElementById("result-card").innerHTML = "璇烽€夋嫨缁堢偣绔?;
    } else if (!fromValue) {
        fromInput.value = stationName;
    } else if (!toValue) {
        toInput.value = stationName;
        calculateRoute();
    } else {
        fromInput.value = stationName;
        toInput.value = "";
        document.getElementById("result-card").className = "result-card empty";
        document.getElementById("result-card").innerHTML = "璇烽€夋嫨缁堢偣绔?;
    }
    
    updateStationHighlight();
}

function updateStationHighlight() {
    var from = document.getElementById("from-station").value;
    var to = document.getElementById("to-station").value;
    var btns = document.querySelectorAll(".station-btn");
    
    for (var i = 0; i < btns.length; i++) {
        var name = btns[i].getAttribute("data-name");
        btns[i].classList.remove("selected-from", "selected-to");
        if (name === from) {
            btns[i].classList.add("selected-from");
        } else if (name === to) {
            btns[i].classList.add("selected-to");
        }
    }
}

function dijkstra(start, end) {
    if (!GRAPH[start] || !GRAPH[end]) return null;
    
    var dist = {}, prev = {}, prevLine = {}, visited = {};
    for (var s in GRAPH) dist[s] = Infinity;
    dist[start] = 0;
    prevLine[start] = null;
    var pq = [{station: start, d: 0, line: null}];
    
    while (pq.length > 0) {
        pq.sort(function(a, b) { return a.d - b.d; });
        var curr = pq.shift();
        var u = curr.station, curLine = curr.line;
        if (visited[u]) continue;
        visited[u] = true;
        if (u === end) break;
        
        for (var neighbor in GRAPH[u]) {
            if (visited[neighbor]) continue;
            var edgeLines = GRAPH[u][neighbor];
            var bestTime = Infinity, bestLine = null;
            for (var i = 0; i < edgeLines.length; i++) {
                var li = edgeLines[i];
                var t = STATION_TIME;
                if (curLine !== null && curLine !== li) t += TRANSFER_PENALTY;
                if (t < bestTime) { bestTime = t; bestLine = li; }
            }
            var alt = dist[u] + bestTime;
            if (alt < dist[neighbor]) {
                dist[neighbor] = alt;
                prev[neighbor] = u;
                prevLine[neighbor] = bestLine;
                pq.push({station: neighbor, d: alt, line: bestLine});
            }
        }
    }
    
    if (dist[end] === Infinity) return null;
    
    var path = [], lines = [], at = end;
    while (at !== undefined) {
        path.unshift(at);
        if (prevLine[at]) lines.unshift(prevLine[at]);
        at = prev[at];
    }
    
    var transfers = [];
    for (var i = 1; i < lines.length; i++) {
        if (lines[i] !== lines[i - 1]) {
            transfers.push({station: path[i], fromLine: lines[i - 1], toLine: lines[i]});
        }
    }
    
    return {path: path, time: dist[end], lines: lines, transfers: transfers, transferCount: transfers.length};
}

function calculateRoute() {
    var from = document.getElementById("from-station").value.trim();
    var to = document.getElementById("to-station").value.trim();
    var resultCard = document.getElementById("result-card");
    
    if (!from || !to) {
        resultCard.className = "result-card empty";
        resultCard.innerHTML = "璇烽€夋嫨璧风偣鍜岀粓鐐圭珯";
        return;
    }
    
    if (from === to) {
        resultCard.className = "result-card empty";
        resultCard.innerHTML = "璧风偣鍜岀粓鐐逛笉鑳界浉鍚?;
        return;
    }
    
    var result = dijkstra(from, to);
    if (!result) {
        resultCard.className = "result-card empty";
        resultCard.innerHTML = "鏈壘鍒颁粠 " + from + " 鍒?" + to + " 鐨勮矾绾?;
        return;
    }
    
    resultCard.className = "result-card";
    
    var lineNames = [];
    for (var i = 0; i < result.lines.length; i++) {
        lineNames.push(LINE_NAMES[result.lines[i]] || result.lines[i]);
    }
    
    var html = '<div style="display:flex;align-items:baseline;gap:10px"><span class="result-time">' + result.time + '</span><span style="font-size:18px;color:#888">鍒嗛挓</span></div>';
    html += '<div class="result-meta">';
    html += '<span class="meta-tag">' + result.path.length + '绔?/span>';
    html += '<span class="meta-tag">' + lineNames.join(" 鈫?") + '</span>';
    html += '<span class="meta-tag transfer">鎹箻' + result.transferCount + '娆?/span>';
    html += '</div>';
    
    html += '<div class="path-viz"><h3>璇︾粏璺緞</h3>';
    for (var i = 0; i < result.path.length; i++) {
        var station = result.path[i];
        var line = result.lines[i];
        var isTransfer = result.transfers.some(function(t) { return t.station === station; });
        var isStart = i === 0;
        var isEnd = i === result.path.length - 1;
        
        html += '<div class="path-station' + (isTransfer ? ' transfer' : '') + '">';
        
        var iconClass = isStart ? ' start' : (isEnd ? ' end' : (isTransfer ? ' transfer' : ''));
        var iconText = isStart ? '璧? : (isEnd ? '缁? : (isTransfer ? '鉄? : ''));
        html += '<div class="station-icon' + iconClass + '">' + iconText + '</div>';
        
        html += '<div><div class="station-name">' + station + '</div>';
        if (isTransfer) {
            var transfer = result.transfers.find(function(t) { return t.station === station; });
            html += '<div class="transfer-info">鎹箻 ' + LINE_NAMES[transfer.fromLine] + ' 鈫?' + LINE_NAMES[transfer.toLine] + '</div>';
        }
        html += '</div>';
        
        html += '<span class="station-line">' + LINE_NAMES[line] + '</span></div>';
        
        if (i < result.path.length - 1) {
            html += '<div class="path-arrow">鈫?/div>';
        }
    }
    html += '</div>';
    
    resultCard.innerHTML = html;
}

function setupSearch() {
    var input = document.getElementById("global-search");
    var suggest = document.getElementById("search-suggest");
    var allStations = Object.keys(STATION_POS).sort();
    
    input.addEventListener("input", function() {
        var q = this.value.trim().toLowerCase();
        if (q.length < 1) {
            suggest.classList.remove("show");
            return;
        }
        
        var matches = [];
        for (var i = 0; i < allStations.length; i++) {
            if (allStations[i].toLowerCase().indexOf(q) >= 0) {
                matches.push(allStations[i]);
                if (matches.length >= 10) break;
            }
        }
        
        if (matches.length === 0) {
            suggest.classList.remove("show");
            return;
        }
        
        var html = "";
        for (var j = 0; j < matches.length; j++) {
            var sName = matches[j];
            var lines = STATION_POS[sName].lines;
            html += '<div class="suggest-item" data-name="' + sName + '">' + sName;
            for (var k = 0; k < lines.length; k++) {
                var color = LINE_COLORS[lines[k]];
                html += '<span class="line-badge" style="background:' + color + '">' + LINE_NAMES[lines[k]] + '</span>';
            }
            html += '</div>';
        }
        suggest.innerHTML = html;
        suggest.classList.add("show");
        
        var items = suggest.querySelectorAll(".suggest-item");
        for (var k = 0; k < items.length; k++) {
            items[k].addEventListener("click", function() {
                var name = this.getAttribute("data-name");
                handleStationClick(name);
                input.value = "";
                suggest.classList.remove("show");
            });
        }
    });
    
    input.addEventListener("blur", function() {
        setTimeout(function() { suggest.classList.remove("show"); }, 200);
    });
    
    var fromInput = document.getElementById("from-station");
    var fromSuggest = document.getElementById("from-suggest");
    setupInputSuggest(fromInput, fromSuggest);
    
    var toInput = document.getElementById("to-station");
    var toSuggest = document.getElementById("to-suggest");
    setupInputSuggest(toInput, toSuggest);
}

        var matches = [];
        for (var i = 0; i < allStations.length; i++) {
            if (allStations[i].toLowerCase().indexOf(q) >= 0) {
                matches.push(allStations[i]);
                if (matches.length >= 10) break;
            }
        }
        
        if (matches.length === 0) {
            suggest.classList.remove("show");
            return;
        }
        
        var html = "";
        for (var j = 0; j < matches.length; j++) {
            var sName = matches[j];

            html += '<div class="suggest-item" data-name="' + sName + '">' + sName;
            for (var k = 0; k < lines.length; k++) {
                var color = LINE_COLORS[lines[k]];
                html += '<span class="line-badge" style="background:' + color + '">' + LINE_NAMES[lines[k]] + '</span>';
            }
            html += '</div>';
        }
        suggest.innerHTML = html;

                var fromInput = document.getElementById("from-station");
                var toInput = document.getElementById("to-station");

            });

    });
    
    input.addEventListener("blur", function() {

}

function swapStations() {
    var f = document.getElementById("from-station");
    var t = document.getElementById("to-station");
    var tmp = f.value;
    f.value = t.value;
    t.value = tmp;
    updateStationHighlight();
    if (f.value && t.value) calculateRoute();
}

buildGraph();
renderLinesList();
setupSearch();

document.getElementById("calc-btn").addEventListener("click", calculateRoute);
document.getElementById("swap-btn").addEventListener("click", swapStations);
</script>
